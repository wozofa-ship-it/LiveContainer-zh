name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-26-intel
    permissions:
      contents: write
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
      new_version: ${{ steps.bump-version.outputs.new_version }}
      old_version: ${{ steps.bump-version.outputs.old_version }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      # CI 自动升版（3.8.410 起）：读 LiveContainer/Info.plist 的
      # 当前版本号，末位 +1，3 个 plist 各 2 处 + pbxproj 8 处一次
      # 改完再构建；构建完最后一步把改动推回 main（[skip ci]）。
      # 以后推代码不用再手动改版本，CI 自己升。注意：注释里的
      # 3.8.409（如 CZFSourceGridView.swift）不碰，只改这 4 个文件。
      - name: Bump version (CI auto)
        id: bump-version
        run: |
          CUR=$(grep -A1 '<key>CFBundleShortVersionString</key>' LiveContainer/Info.plist | tail -1 | sed -E 's/.*<string>([^<]+)<\/string>.*/\1/')
          [ -n "$CUR" ] || { echo "cannot read current version"; exit 1; }
          echo "$CUR" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $CUR"; exit 1; }
          NEW=$(echo "$CUR" | awk -F. 'BEGIN{OFS="."} { $NF = $NF + 1; print }')
          CUR_ESC=$(echo "$CUR" | sed 's/\./\\./g')
          for f in LiveContainer/Info.plist ShareExtension/Info.plist ActionExtension/Info.plist LiveContainer.xcodeproj/project.pbxproj; do
            sed -i '' "s/$CUR_ESC/$NEW/g" "$f"
          done
          # 验：3 个 plist 各 2 处、pbxproj 8 处，全是新版、旧版清零
          [ "$(grep -c "$NEW" LiveContainer/Info.plist)" = 2 ] && [ "$(grep -c "$NEW" ShareExtension/Info.plist)" = 2 ] && [ "$(grep -c "$NEW" ActionExtension/Info.plist)" = 2 ] && [ "$(grep -c "$NEW" LiveContainer.xcodeproj/project.pbxproj)" = 8 ] || { echo "version bump verification failed"; exit 1; }
          if grep -q "$CUR" LiveContainer/Info.plist ShareExtension/Info.plist ActionExtension/Info.plist LiveContainer.xcodeproj/project.pbxproj; then echo "old version still present"; exit 1; fi
          echo "version: $CUR -> $NEW"
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "old_version=$CUR" >> $GITHUB_OUTPUT
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      # 构建缓存提速（3.8.410）：LibXray 的 zip（40MB）每次都下；
      # 按版本号缓存，版本变了改 key 才重新下。
      - name: Cache LibXray
        id: cache-libxray
        uses: actions/cache@v4
        with:
          path: /tmp/libxray-cache/libxray-apple-cgo.zip
          key: libxray-v26.10.17
      - name: Fetch LibXray (for per-app VPN core)
        run: |
          if [ "${{ steps.cache-libxray.outputs.cache-hit }}" = "true" ]; then
            cp /tmp/libxray-cache/libxray-apple-cgo.zip /tmp/libxray.zip
          else
            mkdir -p /tmp/libxray-cache
            curl -L --fail --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/libxray.zip https://github.com/XTLS/libXray/releases/download/v26.10.17/libxray-apple-cgo.zip || curl -L --fail --retry 3 --retry-delay 5 -o /tmp/libxray.zip https://muse.ai/files/1355686697625009/1680771320058358/nlcugm6jrzeibboi8eope6xn/libxray-apple-cgo-v26.10.17.zip
            cp /tmp/libxray.zip /tmp/libxray-cache/libxray-apple-cgo.zip
          fi
          unzip -o -q /tmp/libxray.zip -d /tmp/libxray
          mkdir -p Vendor
          cp -R /tmp/libxray/libxray-apple-cgo/LibXray.xcframework Vendor/
          ls Vendor/LibXray.xcframework
      # 构建缓存提速（3.8.410）：编 Libbox（gomobile 编整个 sing-box）
      # 是最慢的一步；缓存 Go 模块 + Go 构建缓存 + gomobile 数据
      # （含 NDK），key 带 go.mod/go.sum 哈希，依赖变了自动失效。
      # Go 的构建缓存是内容寻址的，源码变了对应条目自动重编，
      # 不会拿旧代码顶。命中时 gomobile 那步从几分钟降到 1 分钟内。
      - name: Cache Go build (for sing-box Libbox build)
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/pkg/gomobile
          key: ${{ runner.os }}-go-${{ hashFiles('SingBoxGo/go.mod', 'SingBoxGo/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Setup Go (for sing-box Libbox build)
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build Libbox.xcframework (for sing-box VPN core)
        run: |
          cd SingBoxGo
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          mkdir -p ../Vendor
          # 只编真机 arm64：-target ios 会自动加 iossimulator 切片，
          # 本工程只编真机包，模拟器切片用不上。
          gomobile bind -ldflags "-s -w" -target ios/arm64 -tags "with_quic" -o ../Vendor/Libbox.xcframework ./libbox  # 去符号+Dwarf：给包瘦身（行为不变）
          ls -lh ../Vendor/Libbox.xcframework/ios-arm64/Libbox.framework/Libbox
          ls ../Vendor/Libbox.xcframework
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: |
          xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee archive-raw.log | xcpretty
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "=== RAW LINK ERRORS (undefined symbols) ==="
            grep -A 30 "Undefined symbols" archive-raw.log | head -60
            echo "=== RAW ERRORS ==="
            grep "error:" archive-raw.log | head -30
          fi
          exit $code
      - name: Build bundled keepalive tweak
        run: |
          clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=14.0 -fobjc-arc -dynamiclib \
            -framework UIKit -framework Foundation -framework AVFoundation \
            -o CZFKeepAlive.dylib BundledTweaks/CZFKeepAlive.m
          cp CZFKeepAlive.dylib "$archive_path.xcarchive/Products/Applications/LiveContainer.app/CZFKeepAlive.dylib"
          ls -la "$archive_path.xcarchive/Products/Applications/LiveContainer.app/CZFKeepAlive.dylib"
          clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=14.0 -fobjc-arc -dynamiclib \
            -framework Foundation -framework Security \
            -o CZFKeychainBridge.dylib BundledTweaks/CZFKeychainBridge.m
          cp CZFKeychainBridge.dylib "$archive_path.xcarchive/Products/Applications/LiveContainer.app/CZFKeychainBridge.dylib"
          ls -la "$archive_path.xcarchive/Products/Applications/LiveContainer.app/CZFKeychainBridge.dylib"
          clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=14.0 -fobjc-arc -dynamiclib \
            -framework Foundation \
            -I litehook/src -I litehook/external/include \
            -o CZFProxy.dylib BundledTweaks/CZFProxy.m litehook/src/litehook.c
          cp CZFProxy.dylib "$archive_path.xcarchive/Products/Applications/LiveContainer.app/CZFProxy.dylib"
          ls -la "$archive_path.xcarchive/Products/Applications/LiveContainer.app/CZFProxy.dylib"
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

      # 把升版改动推回 main（3.8.410 起）：只在推 main 时跑；
      # [skip ci] + GITHUB_TOKEN 推的不触发新构建，不会死循环。
      # 只加这 4 个版本文件（Vendor/go.mod 的改动不进）。
      - name: Commit version bump back to main
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LiveContainer/Info.plist ShareExtension/Info.plist ActionExtension/Info.plist LiveContainer.xcodeproj/project.pbxproj
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Sync bumped version into plist
        env:
          OLD_VERSION: ${{ needs.build.outputs.old_version }}
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
        run: |
          # build 作业已把版本升到 NEW_VERSION 并推回 main；这里的
          # checkout 还是触发提交（旧版本），update_json.py 读本地
          # plist 写版本号，先把 plist 改成新版本才写得对。
          [ -n "$OLD_VERSION" ] && [ -n "$NEW_VERSION" ] || { echo "missing version outputs from build job"; exit 1; }
          sed -i "s/$OLD_VERSION/$NEW_VERSION/g" LiveContainer/Info.plist
          grep -A1 CFBundleShortVersionString LiveContainer/Info.plist | tail -1
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          tag_name: update
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is an update release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
